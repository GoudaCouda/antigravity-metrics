[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-metrics"
version = "0.1.0"
description = "Real-time token telemetry, prompt cache efficiency, and multi-model cost inspector for Google Antigravity"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Austin (GoudaCouda)" }
]
keywords = ["antigravity", "tokens", "llm", "metrics", "gemini", "claude", "cost-calculator", "rich", "tui"]
dependencies = [
    "rich>=13.0.0"
]

[project.scripts]
antigravity-metrics = "token_metrics:main"
token-metrics = "token_metrics:main"

[tool.setuptools]
py-modules = ["token_metrics"]
